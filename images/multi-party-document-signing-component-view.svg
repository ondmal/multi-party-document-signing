<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950" role="img" aria-labelledby="title desc">
  <title id="title">Component view</title>
  <desc id="desc">The external signing platform calls the webhook receiver, which forwards to the WebApi host; consuming services call the WebApi host. The WebApi host and the command-processor host share one Clean Architecture core: Infrastructure wraps Application, which wraps the Domain with the signing process, its sessions and rules. The service depends on PostgreSQL, Blob Storage, a Storage Queue and the external systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#eaefff"/>
    </linearGradient>
    <linearGradient id="oursStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfe"/>
    </linearGradient>
    <linearGradient id="domain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9ff"/>
      <stop offset="1" stop-color="#d6deff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="aAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d84ff"/>
    </marker>
    <marker id="aMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a7b2c6"/>
    </marker>
    <style>
      text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #4f6bff; }
      .eyebrowS{ font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px; fill: #7c8aa5; }
      .h1      { font-size: 21px; font-weight: 600; fill: #0f172a; }
      .ttl     { font-size: 14px; font-weight: 600; fill: #111827; }
      .ttlL    { font-size: 16px; font-weight: 600; fill: #0b1020; }
      .sub     { font-size: 11.5px; fill: #64748b; }
      .subO    { font-size: 11.5px; fill: #4a58b8; }
      .pill    { font-size: 11px; fill: #475569; }
      .legend  { font-size: 11.5px; fill: #64748b; }
      .tag     { font-size: 12px; font-weight: 600; fill: #3546b3; }
      .cardO   { fill: url(#ours); stroke: url(#oursStroke); stroke-width: 1.5; filter: url(#shadow); }
      .cardE   { fill: url(#ext); stroke: #dde3ee; stroke-width: 1.2; filter: url(#shadow); }
      .glowO   { fill: none; stroke: #6d8dff; stroke-width: 6; stroke-opacity: 0.22; }
      .tileO   { fill: #4f6bff; fill-opacity: 0.12; }
      .tileE   { fill: #0f172a; fill-opacity: 0.05; }
      .icO     { fill: none; stroke: #4f6bff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .icE     { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .lnO     { fill: none; stroke: #6d84ff; stroke-width: 1.8; }
      .lnE     { fill: none; stroke: #a7b2c6; stroke-width: 1.5; }
      .pillBg  { fill: #ffffff; stroke: #d6dce8; stroke-width: 1; }
      .tagBg   { fill: #ffffff; stroke: url(#oursStroke); stroke-width: 1.4; filter: url(#shadow); }
      .frame   { fill: #ffffff; fill-opacity: 0.45; stroke: url(#oursStroke); stroke-width: 1.5; stroke-dasharray: 7 5; }
      .ring1   { fill: #ffffff; fill-opacity: 0.85; stroke: #c3cdfa; stroke-width: 1.2; filter: url(#shadow); }
      .ring2   { fill: #f2f5ff; stroke: #a9b8fb; stroke-width: 1.2; }
      .ring3   { fill: url(#domain); stroke: url(#oursStroke); stroke-width: 1.6; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="950" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="950" rx="22" fill="url(#dots)"/>
  <ellipse cx="550" cy="600" rx="460" ry="320" fill="url(#halo)"/>

  <!-- Header -->
  <text class="eyebrow" x="44" y="48">COMPONENT VIEW</text>
  <text class="h1" x="44" y="76">Two hosts over one Clean Architecture core, one thin receiver in front</text>
  <circle cx="842" cy="56" r="5" fill="url(#oursStroke)"/>
  <text class="legend" x="854" y="60">built in this project</text>
  <circle cx="985" cy="56" r="5" fill="#c3ccdb"/>
  <text class="legend" x="997" y="60">external</text>

  <!-- ===== Connectors ===== -->
  <path class="lnE" d="M260 178 V428" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="198" y="276" width="124" height="22" rx="11"/>
  <text class="pill" x="260" y="291" text-anchor="middle">webhooks · external</text>

  <path class="lnO" d="M550 178 V428" marker-end="url(#aAccent)"/>
  <rect class="pillBg" x="492" y="276" width="116" height="22" rx="11"/>
  <text class="pill" x="550" y="291" text-anchor="middle">REST API · internal</text>

  <path class="lnO" d="M380 464 H426" marker-end="url(#aAccent)"/>

  <path class="lnO" d="M550 496 V522 H840 V496"/>
  <path class="lnO" d="M695 522 V554" marker-end="url(#aAccent)"/>
  <circle cx="695" cy="522" r="3.5" fill="#6d84ff"/>

  <path class="lnE" d="M197 790 V844" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="162" y="806" width="70" height="22" rx="11"/>
  <text class="pill" x="197" y="821" text-anchor="middle">EF Core</text>
  <path class="lnE" d="M432 790 V844" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="384" y="806" width="96" height="22" rx="11"/>
  <text class="pill" x="432" y="821" text-anchor="middle">store · retrieve</text>
  <path class="lnE" d="M667 790 V844" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="609" y="806" width="116" height="22" rx="11"/>
  <text class="pill" x="667" y="821" text-anchor="middle">publish · consume</text>
  <path class="lnE" d="M902 790 V844" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="864" y="806" width="76" height="22" rx="11"/>
  <text class="pill" x="902" y="821" text-anchor="middle">adapters</text>

  <!-- ===== External callers ===== -->
  <rect class="cardE" x="130" y="110" width="260" height="64" rx="12"/>
  <rect class="tileE" x="144" y="126" width="32" height="32" rx="8"/>
  <g transform="translate(152 134)">
    <path class="icE" d="M3 1 H10 L13 4 V15 H3 Z"/>
    <path class="icE" d="M5.5 11 C7 9 8 12.5 10.5 10"/>
  </g>
  <text class="ttl" x="188" y="137">External signing platform</text>
  <text class="sub" x="188" y="156">session progress</text>

  <rect class="cardE" x="420" y="110" width="260" height="64" rx="12"/>
  <rect class="tileE" x="434" y="126" width="32" height="32" rx="8"/>
  <g transform="translate(442 134)">
    <rect class="icE" x="1" y="5" width="10" height="10" rx="1.5"/>
    <path class="icE" d="M5 5 V1 H15 V11 H11"/>
  </g>
  <text class="ttl" x="478" y="137">Consuming services</text>
  <text class="sub" x="478" y="156">create · follow · collect</text>

  <!-- ===== Service frame ===== -->
  <rect class="frame" x="90" y="396" width="920" height="394" rx="18"/>
  <rect class="tagBg" x="770" y="383" width="220" height="26" rx="13"/>
  <text class="tag" x="880" y="400" text-anchor="middle">Multi-party signing service</text>

  <!-- Hosts -->
  <rect class="cardO" x="140" y="432" width="240" height="64" rx="12"/>
  <rect class="tileO" x="154" y="448" width="32" height="32" rx="8"/>
  <g transform="translate(162 456)">
    <path class="icO" d="M8 1 L14 3.5 V8 C14 11.5 11 14 8 15 C5 14 2 11.5 2 8 V3.5 Z"/>
  </g>
  <text class="ttl" x="198" y="459">Webhook receiver</text>
  <text class="subO" x="198" y="478">internet-facing · API client only</text>

  <rect class="glowO" x="430" y="432" width="240" height="64" rx="12" filter="url(#glow)"/>
  <rect class="cardO" x="430" y="432" width="240" height="64" rx="12"/>
  <rect class="tileO" x="444" y="448" width="32" height="32" rx="8"/>
  <g transform="translate(452 456)">
    <circle class="icO" cx="8" cy="8" r="6.5"/>
    <path class="icO" d="M1.5 8 H14.5 M8 1.5 C5.5 4 5.5 12 8 14.5 C10.5 12 10.5 4 8 1.5"/>
  </g>
  <text class="ttl" x="488" y="459">WebApi host</text>
  <text class="subO" x="488" y="478">HTTP endpoints · synchronous</text>

  <rect class="glowO" x="720" y="432" width="240" height="64" rx="12" filter="url(#glow)"/>
  <rect class="cardO" x="720" y="432" width="240" height="64" rx="12"/>
  <rect class="tileO" x="734" y="448" width="32" height="32" rx="8"/>
  <g transform="translate(742 456)">
    <path class="icO" d="M9.5 1 L3 9 H8 L6.5 15 L13 7 H8 Z"/>
  </g>
  <text class="ttl" x="778" y="459">Command processor</text>
  <text class="subO" x="778" y="478">Azure Functions · queue &amp; timers</text>

  <!-- Core captions -->
  <text class="eyebrowS" x="140" y="548">CLEAN ARCHITECTURE CORE</text>
  <text class="eyebrowS" x="960" y="548" text-anchor="end">DEPENDENCIES POINT INWARD</text>

  <!-- Concentric layers -->
  <rect class="ring1" x="140" y="560" width="820" height="210" rx="16"/>
  <rect class="tileO" x="156" y="574" width="32" height="32" rx="8"/>
  <g transform="translate(164 582)">
    <path class="icO" d="M5 1 V5 M11 1 V5 M3 5 H13 V8 C13 11 10.8 13 8 13 C5.2 13 3 11 3 8 Z M8 13 V15"/>
  </g>
  <text class="ttl" x="200" y="587">Infrastructure</text>
  <text class="sub" x="200" y="604">EF Core · outbox · queue · blobs · external adapters</text>

  <rect class="ring2" x="200" y="618" width="700" height="140" rx="14"/>
  <rect class="tileO" x="216" y="632" width="32" height="32" rx="8"/>
  <g transform="translate(224 640)">
    <path class="icO" d="M2 3 H14 M2 8 H10 M2 13 H12"/>
  </g>
  <text class="ttl" x="260" y="645">Application</text>
  <text class="sub" x="260" y="662">use cases · command handlers · ports</text>

  <rect class="glowO" x="260" y="676" width="580" height="70" rx="12" filter="url(#glow)"/>
  <rect class="ring3" x="260" y="676" width="580" height="70" rx="12"/>
  <text class="ttlL" x="550" y="704" text-anchor="middle">Domain</text>
  <text class="subO" x="550" y="725" text-anchor="middle">signing process · sessions per signatory · all-or-nothing rules</text>

  <!-- ===== Dependencies ===== -->
  <rect class="cardE" x="90" y="850" width="215" height="64" rx="12"/>
  <rect class="tileE" x="104" y="866" width="32" height="32" rx="8"/>
  <g transform="translate(112 874)">
    <ellipse class="icE" cx="8" cy="3.5" rx="6" ry="2.5"/>
    <path class="icE" d="M2 3.5 V12.5 C2 13.9 4.7 15 8 15 C11.3 15 14 13.9 14 12.5 V3.5 M2 8 C2 9.4 4.7 10.5 8 10.5 C11.3 10.5 14 9.4 14 8"/>
  </g>
  <text class="ttl" x="148" y="877">PostgreSQL</text>
  <text class="sub" x="148" y="896">state · outbox · history</text>

  <rect class="cardE" x="325" y="850" width="215" height="64" rx="12"/>
  <rect class="tileE" x="339" y="866" width="32" height="32" rx="8"/>
  <g transform="translate(347 874)">
    <path class="icE" d="M3 1 H10 L13 4 V15 H3 Z M10 1 V4 H13"/>
  </g>
  <text class="ttl" x="383" y="877">Blob Storage</text>
  <text class="sub" x="383" y="896">signed documents</text>

  <rect class="cardE" x="560" y="850" width="215" height="64" rx="12"/>
  <rect class="tileE" x="574" y="866" width="32" height="32" rx="8"/>
  <g transform="translate(582 874)">
    <rect class="icE" x="1" y="2" width="14" height="3.5" rx="1"/>
    <rect class="icE" x="1" y="6.5" width="14" height="3.5" rx="1"/>
    <rect class="icE" x="1" y="11" width="14" height="3.5" rx="1"/>
  </g>
  <text class="ttl" x="618" y="877">Storage Queue</text>
  <text class="sub" x="618" y="896">async commands</text>

  <rect class="cardE" x="795" y="850" width="215" height="64" rx="12"/>
  <rect class="tileE" x="809" y="866" width="32" height="32" rx="8"/>
  <g transform="translate(817 874)">
    <path class="icE" d="M6.5 9.5 L9.5 6.5 M7 4 L8.8 2.2 C10.4 0.6 13 0.6 14.3 2 C15.7 3.3 15.7 5.9 14.1 7.5 L12.3 9.3 M9.3 12.3 L7.5 14.1 C5.9 15.7 3.3 15.7 2 14.3 C0.6 13 0.6 10.4 2.2 8.8 L4 7"/>
  </g>
  <text class="ttl" x="853" y="877">External systems</text>
  <text class="sub" x="853" y="896">platform · consumers · e-mail</text>
</svg>
